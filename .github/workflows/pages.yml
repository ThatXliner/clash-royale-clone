name: Publish GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify shipping isolation rules
        run: npm run test:shipping-isolation-guard
      - name: Verify the release artifact builder
        run: npm run test:release-build
      - name: Verify the Pages artifact
        run: npm run test:publication-pages
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build the project-subpath artifact
        run: npm run build:pages -- --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_SHA"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish the manually requested Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
