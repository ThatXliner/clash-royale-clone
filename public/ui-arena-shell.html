<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="color-scheme" content="dark">
    <title>Original Card Battler — Arena Shell</title>
    <link rel="stylesheet" href="../src/ui/arena-shell.css">
    <style id="arena-production-art">
      .arena {
        background-color: #e3cd9e;
        background-image:
          radial-gradient(120px 46px at 270px 160px, #4a332a1f 99%, transparent 100%),
          radial-gradient(70px 30px at 105px 235px, #4a332a1f 99%, transparent 100%),
          radial-gradient(70px 30px at 435px 235px, #4a332a1f 99%, transparent 100%),
          radial-gradient(150px 70px at 170px 120px, #baa88173 99%, transparent 100%),
          radial-gradient(110px 80px at 420px 270px, #baa88152 99%, transparent 100%),
          radial-gradient(70px 50px at 110px 330px, #f4ebd638 99%, transparent 100%),
          radial-gradient(140px 60px at 200px 630px, #4b713a80 99%, transparent 100%),
          radial-gradient(120px 70px at 420px 800px, #4b713a66 99%, transparent 100%),
          radial-gradient(70px 50px at 120px 830px, #dcede924 99%, transparent 100%),
          linear-gradient(90deg, transparent 0 75px, #e3cd9e38 75px 135px, transparent 135px 405px, #e3cd9e38 405px 465px, transparent 465px),
          linear-gradient(transparent 0 448px, #191d2266 448px 450px, transparent 450px 510px, #191d2266 510px 512px, transparent 512px),
          linear-gradient(transparent 0 436px, #baa881 436px 450px, transparent 450px 510px, #4b713a 510px 524px, transparent 524px),
          linear-gradient(transparent 0 450px, #5c8a46 450px);
        border-color: #8b8578;
      }
      .arena::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(#f4ebd629, transparent 6px),
          linear-gradient(90deg, #f4ebd61f, transparent 6px),
          linear-gradient(0deg, #191d2333, transparent 8px),
          linear-gradient(270deg, #191d2324, transparent 8px);
      }
      .arena-half--north {
        background: #4a332a;
        opacity: 0.1;
      }
      .arena-half--south {
        background: #16324f;
        opacity: 0.1;
      }
      .lane {
        border-inline: 2px dashed #191d2226;
        background: transparent;
      }
      .river {
        border-block: 3px solid #191d22;
        background: linear-gradient(#2e7f86, #16324f 52%, #2e7f86);
        box-shadow: none;
      }
      .river::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          repeating-linear-gradient(90deg, #dcede99c 0 14px, transparent 14px 26px),
          repeating-linear-gradient(90deg, #dcede97d 0 14px, transparent 14px 26px);
        background-size: 100% 2px, 100% 2px;
        background-position: 0 5px, 0 51px;
        background-repeat: no-repeat, no-repeat;
      }
      .river::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(transparent 14px, #16324f59 14px 42px, transparent 42px);
      }
      .bridge {
        padding: 0;
        border: 3px solid #191d22;
        border-radius: 3px;
        background: #8b8578;
        box-shadow: 8px 10px 0 #191d2247;
      }
      .bridge::before,
      .bridge::after {
        content: "";
        position: absolute;
        width: 10px;
        height: 10px;
        box-sizing: border-box;
        background: #978f81;
        border: 2px solid #191d22;
      }
      .bridge::before {
        left: -4px;
        top: -4px;
      }
      .bridge::after {
        right: -4px;
        bottom: -4px;
      }
      .bridge i {
        border-block: 2px solid #6f6a5f;
        background: #978f81;
      }
      .bridge i:nth-child(even) {
        background: #8b8578;
      }
      .bridge i:first-child {
        border-top: 3px solid #191d22;
      }
      .bridge i:last-child {
        border-bottom: 3px solid #191d22;
      }
      .tower-pad {
        border: 3px solid #191d22;
        border-radius: 4px;
        background: linear-gradient(
          transparent 0 calc(100% - 22px),
          #8b8578 calc(100% - 22px) calc(100% - 12px),
          #726d62 calc(100% - 12px));
        box-shadow: 8px 10px 0 #191d2236;
      }
      .tower-pad::before,
      .tower-pad::after,
      .tower-pad i {
        position: absolute;
        box-sizing: border-box;
      }
      .tower-pad--north-west::before,
      .tower-pad--north-east::before {
        left: 16px;
        top: 20px;
        width: 58px;
        height: 48px;
        border: 2px solid #191d22;
        background: linear-gradient(90deg, #4a332a 0 60%, #3d2a22 60%);
      }
      .tower-pad--north-west::after,
      .tower-pad--north-east::after {
        left: 38px;
        top: 5px;
        width: 14px;
        height: 15px;
        background: #e9a83a;
        clip-path: polygon(50% 0, 100% 100%, 0 100%);
      }
      .tower-pad--north-west i,
      .tower-pad--north-east i {
        left: 50%;
        top: 27px;
        width: 18px;
        height: 33px;
        translate: -50% 0;
        border: 2px solid #191d22;
        background: linear-gradient(#e9a83a 0 6px, #c6452e 6px);
        clip-path: polygon(0 0, 100% 0, 100% 74%, 50% 100%, 0 74%);
      }
      .tower-pad--north-central::before {
        left: 22px;
        top: 26px;
        width: 76px;
        height: 64px;
        border: 2px solid #191d22;
        background: linear-gradient(90deg, #4a332a 0 60%, #3d2a22 60%);
      }
      .tower-pad--north-central::after {
        left: 51px;
        top: 5px;
        width: 18px;
        height: 19px;
        background: #e9a83a;
        clip-path: polygon(50% 0, 100% 100%, 0 100%);
      }
      .tower-pad--north-central i {
        left: 50%;
        top: 33px;
        width: 26px;
        height: 46px;
        translate: -50% 0;
        border: 2px solid #191d22;
        background: linear-gradient(#e9a83a 0 7px, #c6452e 7px);
        clip-path: polygon(0 0, 100% 0, 100% 76%, 50% 100%, 0 76%);
      }
      .tower-pad--south-west::before,
      .tower-pad--south-east::before {
        left: 16px;
        top: 30px;
        width: 58px;
        height: 38px;
        border: 2px solid #191d22;
        border-radius: 9px;
        background:
          radial-gradient(14px 13px at 50% 100%, #16324f 97%, transparent 100%),
          linear-gradient(90deg, #2e7f86 0 60%, #25686e 60%);
      }
      .tower-pad--south-west::after,
      .tower-pad--south-east::after {
        left: 12px;
        top: 4px;
        width: 66px;
        height: 30px;
        border: 2px solid #191d22;
        border-bottom: none;
        border-radius: 33px 33px 0 0;
        background:
          radial-gradient(26px 20px at 68% 60%, #25686e 97%, transparent 100%)
          #2e7f86;
      }
      .tower-pad--south-west i,
      .tower-pad--south-east i {
        left: 50%;
        top: 9px;
        width: 13px;
        height: 13px;
        translate: -50% 0;
        border: 2px solid #191d22;
        border-radius: 50%;
        background: #dcede9;
      }
      .tower-pad--south-central::before {
        left: 22px;
        top: 40px;
        width: 76px;
        height: 50px;
        border: 2px solid #191d22;
        border-radius: 11px;
        background:
          radial-gradient(5px 5px at 24% 42%, #16324f 97%, transparent 100%),
          radial-gradient(5px 5px at 76% 42%, #16324f 97%, transparent 100%),
          radial-gradient(16px 15px at 50% 100%, #16324f 97%, transparent 100%),
          linear-gradient(90deg, #2e7f86 0 60%, #25686e 60%);
      }
      .tower-pad--south-central::after {
        left: 18px;
        top: 6px;
        width: 84px;
        height: 38px;
        border: 2px solid #191d22;
        border-bottom: none;
        border-radius: 42px 42px 0 0;
        background:
          radial-gradient(30px 24px at 68% 60%, #25686e 97%, transparent 100%)
          #2e7f86;
      }
      .tower-pad--south-central i {
        left: 50%;
        top: 12px;
        width: 16px;
        height: 16px;
        translate: -50% 0;
        border: 2px solid #191d22;
        border-radius: 50%;
        background: #dcede9;
      }
    </style>
  </head>
  <body>
    <div data-arena-shell-root></div>
    <script type="module" src="../src/ui/arena-shell-entry.js"></script>
  </body>
</html>
