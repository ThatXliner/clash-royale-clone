<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skymaul fixed-pose battle sprite fixture</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #15231f; color: #f4ebd6; font: 12px/1.25 system-ui, sans-serif; }
    main { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 8px; }
    figure { position: relative; display: grid; place-items: start; min-width: 0; margin: 0; background-color: #293a35; background-image: linear-gradient(45deg,#ffffff0b 25%,transparent 25%,transparent 75%,#ffffff0b 75%),linear-gradient(45deg,#ffffff0b 25%,transparent 25%,transparent 75%,#ffffff0b 75%); background-position: 0 0, 8px 8px; background-size: 16px 16px; outline: 1px solid #f4ebd633; }
    figcaption { position: absolute; z-index: 1; left: 2px; bottom: 2px; padding: 1px 3px; background: #101915cc; }
  </style>
</head>
<body>
  <main id="samples" aria-label="Skymaul team, facing, and fixed-pose sprite samples"></main>
  <script type="module" src="./skymaul-battle-sprite-browser-fixture.js"></script>
</body>
</html>
