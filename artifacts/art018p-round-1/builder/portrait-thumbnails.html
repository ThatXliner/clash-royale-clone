<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ember Basin portrait size fixture</title>
    <style>
      :root { color-scheme: light; font: 14px/1.4 system-ui, sans-serif; }
      html, body { margin: 0; min-height: 100%; background: #e6e1d5; color: #293229; }
      body { box-sizing: border-box; display: flex; align-items: flex-start; gap: 32px; padding: 24px; }
      figure { display: grid; justify-items: start; gap: 8px; margin: 0; }
      img { display: block; border: 0; object-fit: cover; }
      figcaption { color: #465046; }
    </style>
  </head>
  <body>
    <figure>
      <img id="thumb-64" src="../../../public/assets/ember-basin-portrait-painted.webp" width="64" height="64" alt="Ember Basin at 64 pixels">
      <figcaption>64 px</figcaption>
    </figure>
    <figure>
      <img id="thumb-128" src="../../../public/assets/ember-basin-portrait-painted.webp" width="128" height="128" alt="Ember Basin at 128 pixels">
      <figcaption>128 px</figcaption>
    </figure>
  </body>
</html>
