<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 13 13" shape-rendering="crispEdges" role="img" aria-labelledby="title desc">
  <title id="title">Buried Coil, revealed form</title>
  <desc id="desc">An original three-footed rootwood lookout with two open copper coil rings and a bright emberseed core.</desc>
  <metadata>Original code-drawn vector prototype by Codex for Moss &amp; Ember. Authored from the approved Buried Coil concept; no reference art, bitmap tracing, external imagery, or embedded fonts.</metadata>

  <!-- The crown uses two nested, open rectangular coil loops with a one-pixel clear gap. -->
  <path fill="#3d2b21" fill-rule="evenodd" d="M3 0H10V3H3Z M5 1H8V2H5Z"/>
  <path fill="#c66f32" fill-rule="evenodd" d="M4 0H9V3H4Z M5 1H8V2H5Z"/>
  <path fill="#e8a34b" d="M5 0H8V1H5Z"/>
  <path fill="#814528" d="M4 2H9V3H4Z"/>

  <path fill="#3d2b21" fill-rule="evenodd" d="M2 4H11V7H2Z M4 5H9V6H4Z"/>
  <path fill="#c66f32" fill-rule="evenodd" d="M3 4H10V7H3Z M4 5H9V6H4Z"/>
  <path fill="#e8a34b" d="M4 4H9V5H4Z"/>
  <path fill="#814528" d="M3 6H10V7H3Z"/>

  <!-- A compact rootwood mast and housing; the emberseed is the single bright core. -->
  <rect x="5" y="7" width="3" height="1" fill="#70482f"/>
  <rect x="4" y="8" width="5" height="2" fill="#3d2b21"/>
  <rect x="5" y="8" width="3" height="1" fill="#c66f32"/>
  <rect x="6" y="8" width="1" height="2" fill="#ffd45a"/>

  <!-- Three independent stepped legs terminate in separated, two-pixel feet. -->
  <path fill="#503927" d="M4 9H5V10H4V11H2V10H3V9Z"/>
  <path fill="#503927" d="M8 9H9V10H10V11H8V10H9V9Z"/>
  <rect x="6" y="9" width="1" height="2" fill="#503927"/>
  <path fill="#3d2b21" d="M1 11H4V13H1Z M5 11H8V13H5Z M9 11H12V13H9Z"/>
  <path fill="#c66f32" d="M1 11H4V12H1Z M5 11H8V12H5Z M9 11H12V12H9Z"/>
  <path fill="#e8a34b" d="M2 11H3V12H2Z M6 11H7V12H6Z M10 11H11V12H10Z"/>
</svg>
