<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 408" role="img" aria-labelledby="title description">
  <title id="title">Briar Runner original sprite sheet</title>
  <desc id="description">Sixteen original vector frames: two walking and two attacking frames for each cardinal direction.</desc>
  <defs>
    <style>
      .edge{stroke:#101a22;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
      .coat{fill:currentColor}
      .trim{fill:var(--team-accent,currentColor)}
      .leather{fill:#634536}
      .leaf{fill:#86a55c}
      .pale{fill:#f2e8d2}
      .metal{fill:#c8d0c5}
      .shade{fill:#101a2244}
      .slash{fill:none;stroke:#f2a25e;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <g id="runner-core-south">
      <path class="edge coat" d="m20 28 8-7h9l8 7 5 15-8 8H23l-8-8Z"/>
      <path class="edge trim" d="m19 31 13 5 14-7 2 7-14 8-16-6Z"/>
      <path class="edge leather" d="m25 28 7-3 8 3 3 8-7 6-9-3-5-6Z"/>
      <path class="edge leaf" d="M21 24q-1-12 11-16 12 3 12 16l-6 8H27Z"/>
      <path class="edge pale" d="m25 25 5 1m5 0 5-1"/>
      <path class="edge" fill="none" d="M29 31q3 2 6 0"/>
      <path class="edge metal" d="m17 33-7 10 3 3 11-9m22-4 7 8-4 4-10-8"/>
      <path class="edge leather" d="m12 43 6-2 3 3-5 7-6-2Z"/>
      <path class="edge leather" d="m49 41 6 2 2 6-6 2-5-7Z"/>
      <path class="edge" fill="none" d="m24 48 8 2 9-2"/>
      <path class="edge leaf" d="m29 8 3-6 3 6 6-3-2 7"/>
      <path class="edge shade" d="M20 56q12-5 25 0-12 5-25 0Z"/>
    </g>
    <g id="runner-walk-legs-0">
      <path class="edge leather" d="m25 43-8 7 4 5 12-8m7-5 8 7-3 6-13-7"/>
    </g>
    <g id="runner-walk-legs-1">
      <path class="edge leather" d="m25 43 1 10 6 2 2-9m6-3-2 10 6 3 5-10"/>
    </g>
    <g id="runner-attack-arm">
      <path class="edge trim" d="m43 34 9 4 4 8-5 3-8-7Z"/>
      <path class="edge leather" d="m51 42 7 1 3 3-7 4-5-3Z"/>
    </g>
    <g id="runner-thorn-spear">
      <path class="edge leather" d="m53 44 4 1 5 15-3 1Z"/>
      <path class="edge metal" d="m55 45 1-9 5 8-2 6Z"/>
      <path class="edge leaf" d="m57 38 4-7 1 8Z"/>
    </g>
    <g id="runner-attack-spark">
      <path class="slash" d="M43 16q13 5 11 16"/>
      <path class="edge" fill="#f2a25e" d="m53 15 3-6 1 7 6 3-7 1-3 6-1-7-6-3Z"/>
    </g>
    <symbol id="briar-walk-south-0" viewBox="0 0 64 64">
      <use href="#runner-walk-legs-0"/>
      <use href="#runner-core-south"/>
    </symbol>
    <symbol id="briar-walk-south-1" viewBox="0 0 64 64">
      <use href="#runner-walk-legs-1"/>
      <g transform="translate(0 -1)"><use href="#runner-core-south"/></g>
    </symbol>
    <symbol id="briar-attack-south-0" viewBox="0 0 64 64">
      <use href="#runner-walk-legs-1"/>
      <use href="#runner-core-south"/>
      <use href="#runner-attack-arm"/>
      <use href="#runner-thorn-spear"/>
    </symbol>
    <symbol id="briar-attack-south-1" viewBox="0 0 64 64">
      <use href="#runner-walk-legs-0"/>
      <g transform="translate(0 -1)"><use href="#runner-core-south"/></g>
      <g transform="translate(1 -1)"><use href="#runner-attack-arm"/><use href="#runner-thorn-spear"/></g>
      <use href="#runner-attack-spark"/>
    </symbol>
    <symbol id="briar-walk-north-0" viewBox="0 0 64 64"><use href="#briar-walk-south-0" transform="rotate(180 32 32)"/></symbol>
    <symbol id="briar-walk-north-1" viewBox="0 0 64 64"><use href="#briar-walk-south-1" transform="rotate(180 32 32)"/></symbol>
    <symbol id="briar-attack-north-0" viewBox="0 0 64 64"><use href="#briar-attack-south-0" transform="rotate(180 32 32)"/></symbol>
    <symbol id="briar-attack-north-1" viewBox="0 0 64 64"><use href="#briar-attack-south-1" transform="rotate(180 32 32)"/></symbol>
    <symbol id="briar-walk-east-0" viewBox="0 0 64 64"><use href="#briar-walk-south-0" transform="rotate(-90 32 32)"/></symbol>
    <symbol id="briar-walk-east-1" viewBox="0 0 64 64"><use href="#briar-walk-south-1" transform="rotate(-90 32 32)"/></symbol>
    <symbol id="briar-attack-east-0" viewBox="0 0 64 64"><use href="#briar-attack-south-0" transform="rotate(-90 32 32)"/></symbol>
    <symbol id="briar-attack-east-1" viewBox="0 0 64 64"><use href="#briar-attack-south-1" transform="rotate(-90 32 32)"/></symbol>
    <symbol id="briar-walk-west-0" viewBox="0 0 64 64"><use href="#briar-walk-south-0" transform="rotate(90 32 32)"/></symbol>
    <symbol id="briar-walk-west-1" viewBox="0 0 64 64"><use href="#briar-walk-south-1" transform="rotate(90 32 32)"/></symbol>
    <symbol id="briar-attack-west-0" viewBox="0 0 64 64"><use href="#briar-attack-south-0" transform="rotate(90 32 32)"/></symbol>
    <symbol id="briar-attack-west-1" viewBox="0 0 64 64"><use href="#briar-attack-south-1" transform="rotate(90 32 32)"/></symbol>
  </defs>
  <rect width="600" height="408" rx="18" fill="#101a22"/>
  <text x="24" y="28" fill="#e9e2cd" font-family="system-ui,sans-serif" font-size="13" font-weight="700">BRIAR RUNNER · ORIGINAL VECTOR FRAME SHEET</text>
  <g fill="#9bbb76" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle">
    <text x="192" y="48">WALK 0</text><text x="286" y="48">WALK 1</text><text x="380" y="48">ATTACK 0</text><text x="474" y="48">ATTACK 1</text>
  </g>
  <g fill="#e9e2cd" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="end">
    <text x="69" y="104">NORTH</text><text x="69" y="190">EAST</text><text x="69" y="276">SOUTH</text><text x="69" y="362">WEST</text>
  </g>
  <g fill="none" stroke="#34454d" stroke-width="1">
    <rect x="118" y="59" width="104" height="78" rx="7"/><rect x="230" y="59" width="104" height="78" rx="7"/><rect x="342" y="59" width="104" height="78" rx="7"/><rect x="454" y="59" width="104" height="78" rx="7"/>
    <rect x="118" y="145" width="104" height="78" rx="7"/><rect x="230" y="145" width="104" height="78" rx="7"/><rect x="342" y="145" width="104" height="78" rx="7"/><rect x="454" y="145" width="104" height="78" rx="7"/>
    <rect x="118" y="231" width="104" height="78" rx="7"/><rect x="230" y="231" width="104" height="78" rx="7"/><rect x="342" y="231" width="104" height="78" rx="7"/><rect x="454" y="231" width="104" height="78" rx="7"/>
    <rect x="118" y="317" width="104" height="78" rx="7"/><rect x="230" y="317" width="104" height="78" rx="7"/><rect x="342" y="317" width="104" height="78" rx="7"/><rect x="454" y="317" width="104" height="78" rx="7"/>
  </g>
  <g color="#d85b4f">
    <use href="#briar-walk-north-0" x="138" y="67" width="64" height="64"/><use href="#briar-walk-north-1" x="250" y="67" width="64" height="64"/><use href="#briar-attack-north-0" x="362" y="67" width="64" height="64"/><use href="#briar-attack-north-1" x="474" y="67" width="64" height="64"/>
    <use href="#briar-walk-east-0" x="138" y="153" width="64" height="64"/><use href="#briar-walk-east-1" x="250" y="153" width="64" height="64"/><use href="#briar-attack-east-0" x="362" y="153" width="64" height="64"/><use href="#briar-attack-east-1" x="474" y="153" width="64" height="64"/>
    <use href="#briar-walk-south-0" x="138" y="239" width="64" height="64"/><use href="#briar-walk-south-1" x="250" y="239" width="64" height="64"/><use href="#briar-attack-south-0" x="362" y="239" width="64" height="64"/><use href="#briar-attack-south-1" x="474" y="239" width="64" height="64"/>
    <use href="#briar-walk-west-0" x="138" y="325" width="64" height="64"/><use href="#briar-walk-west-1" x="250" y="325" width="64" height="64"/><use href="#briar-attack-west-0" x="362" y="325" width="64" height="64"/><use href="#briar-attack-west-1" x="474" y="325" width="64" height="64"/>
  </g>
</svg>
