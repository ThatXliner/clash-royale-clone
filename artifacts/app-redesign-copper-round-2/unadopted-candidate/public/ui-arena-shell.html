<html lang="en">
  <head>

    <title>Original Card Battler — Arena Shell</title>
    <link rel="stylesheet" href="../src/ui/arena-shell.css">
    <style id="arena-production-art">
      .arena {
        background-color: #e3cd9e;
        background-image:
          radial-gradient(120px 46px at 270px 160px, #4a332a1f 99%, transparent 100%),
          radial-gradient(70px 30px at 105px 235px, #4a332a1f 99%, transparent 100%),
          radial-gradient(70px 30px at 435px 235px, #4a332a1f 99%, transparent 100%),
          radial-gradient(150px 70px at 170px 120px, #baa88173 99%, transparent 100%),
          radial-gradient(110px 80px at 420px 270px, #baa88152 99%, transparent 100%),
          radial-gradient(70px 50px at 110px 330px, #f4ebd638 99%, transparent 100%),
          radial-gradient(140px 60px at 200px 630px, #4b713a80 99%, transparent 100%),
          radial-gradient(120px 70px at 420px 800px, #4b713a66 99%, transparent 100%),
          radial-gradient(70px 50px at 120px 830px, #dcede924 99%, transparent 100%),
          linear-gradient(90deg, transparent 0 75px, #e3cd9e38 75px 135px, transparent 135px 405px, #e3cd9e38 405px 465px, transparent 465px),
          linear-gradient(transparent 0 448px, #191d2266 448px 450px, transparent 450px 510px, #191d2266 510px 512px, transparent 512px),
          linear-gradient(transparent 0 436px, #baa881 436px 450px, transparent 450px 510px, #4b713a 510px 524px, transparent 524px),
          linear-gradient(transparent 0 450px, #5c8a46 450px);
        border-color: #8b8578;
      }
      .arena::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(#f4ebd629, transparent 6px),
          linear-gradient(90deg, #f4ebd61f, transparent 6px),
          linear-gradient(0deg, #191d2333, transparent 8px),
          linear-gradient(270deg, #191d2324, transparent 8px);
      }
      .arena-half--north {
        background: #4a332a;
        opacity: 0.1;
      }
      .arena-half--south {
        background: #16324f;
        opacity: 0.1;
      }
      .lane {
        border-inline: 2px dashed #191d2226;
        background: transparent;
      }
      .river {
        border-block: 3px solid #191d22;
        background: linear-gradient(#2e7f86, #16324f 52%, #2e7f86);
        box-shadow: none;
      }
      .river::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          repeating-linear-gradient(90deg, #dcede99c 0 14px, transparent 14px 26px),
          repeating-linear-gradient(90deg, #dcede97d 0 14px, transparent 14px 26px);
        background-size: 100% 2px, 100% 2px;
        background-position: 0 5px, 0 51px;
        background-repeat: no-repeat, no-repeat;
      }
      .river::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(transparent 14px, #16324f59 14px 42px, transparent 42px);
      }
      .bridge {
        padding: 0;
        border: 3px solid #191d22;
        border-radius: 3px;
        background: #8b8578;
        box-shadow: 8px 10px 0 #191d2247;
      }
      .bridge::before,
      .bridge::after {
        content: "";
        position: absolute;
        width: 10px;
        height: 10px;
        box-sizing: border-box;
        background: #978f81;
        border: 2px solid #191d22;
      }
      .bridge::before {
        left: -4px;
        top: -4px;
      }
      .bridge::after {
        right: -4px;
        bottom: -4px;
      }
      .bridge i {
        border-block: 2px solid #6f6a5f;
        background: #978f81;
      }
      .bridge i:nth-child(even) {
        background: #8b8578;
      }
      .bridge i:first-child {
        border-top: 3px solid #191d22;
      }
      .bridge i:last-child {
        border-bottom: 3px solid #191d22;
      }
      .tower-pad {
        border: 3px solid transparent;
        border-radius: 4px;
        background: linear-gradient(
          transparent 0 calc(100% - 22px),
          #8b8578 calc(100% - 22px) calc(100% - 12px),
          #726d62 calc(100% - 12px));
        background-clip: padding-box;
        box-shadow: inset 0 -4px #4a332a;
      }
      .tower-pad::before,
      .tower-pad::after {
        content: "";
      }
      .tower-pad::before,
      .tower-pad::after,
      .tower-pad i {
        position: absolute;
        box-sizing: border-box;
      }
      .tower-pad--north-west::before,
      .tower-pad--north-east::before,
      .tower-pad--north-central::before {
        left: 12px;
        top: 25px;
        width: 60px;
        height: 50px;
        border: 2px solid #191d22;
        border-radius: 2px 2px 5px 5px;
        background:
          repeating-linear-gradient(0deg, transparent 0 13px, #4a332a 13px 15px),
          linear-gradient(90deg, #e9a83a 0 72%, #4a332a 72%);
        box-shadow: inset 0 6px #4a332a, 4px 4px 0 #191d2236;
      }
      .tower-pad--north-west::after,
      .tower-pad--north-east::after,
      .tower-pad--north-central::after {
        left: 5px;
        top: 4px;
        width: 74px;
        height: 33px;
        background: linear-gradient(115deg, #c6452e 0 66%, #4a332a 66%);
        border-bottom: 5px solid #191d22;
        clip-path: polygon(0 82%, 14% 30%, 35% 30%, 35% 0,
          48% 0, 48% 30%, 76% 30%, 100% 82%, 100% 100%, 0 100%);
      }
      .tower-pad--north-west i,
      .tower-pad--north-east i,
      .tower-pad--north-central i {
        left: 33px;
        top: 51px;
        width: 18px;
        height: 24px;
        translate: 0 0;
        border: 3px solid #4a332a;
        border-radius: 3px 3px 0 0;
        background: #191d22;
        box-shadow: inset 4px 0 #c6452e;
      }
      .tower-pad[data-side="north"] i::before,
      .tower-pad[data-side="north"] i::after {
        content: "";
        position: absolute;
        top: -11px;
        width: 5px;
        height: 9px;
        background: #191d22;
        border-top: 2px solid #4a332a;
      }
      .tower-pad[data-side="north"] i::before { left: -13px; }
      .tower-pad[data-side="north"] i::after { right: -13px; }
      .tower-pad--north-central::before {
        left: 14px;
        top: 34px;
        width: 86px;
        height: 68px;
      }
      .tower-pad--north-central::after {
        left: 6px;
        top: 3px;
        width: 102px;
        height: 44px;
      }
      .tower-pad--north-central i {
        left: 42px;
        top: 69px;
        width: 26px;
        height: 33px;
      }
      .tower-pad--south-west::before,
      .tower-pad--south-east::before {
        left: 16px;
        top: 30px;
        width: 58px;
        height: 38px;
        border: 2px solid #191d22;
        border-radius: 9px;
        background:
          radial-gradient(14px 13px at 50% 100%, #16324f 97%, transparent 100%),
          linear-gradient(90deg, #2e7f86 0 60%, #25686e 60%);
      }
      .tower-pad--south-west::after,
      .tower-pad--south-east::after {
        left: 12px;
        top: 4px;
        width: 66px;
        height: 30px;
        border: 2px solid #191d22;
        border-bottom: none;
        border-radius: 33px 33px 0 0;
        background:
          radial-gradient(26px 20px at 68% 60%, #25686e 97%, transparent 100%)
          #2e7f86;
      }
      .tower-pad--south-west i,
      .tower-pad--south-east i {
        left: 50%;
        top: 9px;
        width: 13px;
        height: 13px;
        translate: -50% 0;
        border: 2px solid #191d22;
        border-radius: 50%;
        background: #dcede9;
      }
      .tower-pad--south-central::before {
        left: 22px;
        top: 40px;
        width: 76px;
        height: 50px;
        border: 2px solid #191d22;
        border-radius: 11px;
        background:
          radial-gradient(5px 5px at 24% 42%, #16324f 97%, transparent 100%),
          radial-gradient(5px 5px at 76% 42%, #16324f 97%, transparent 100%),
          radial-gradient(16px 15px at 50% 100%, #16324f 97%, transparent 100%),
          linear-gradient(90deg, #2e7f86 0 60%, #25686e 60%);
      }
      .tower-pad--south-central::after {
        left: 18px;
        top: 6px;
        width: 84px;
        height: 38px;
        border: 2px solid #191d22;
        border-bottom: none;
        border-radius: 42px 42px 0 0;
        background:
          radial-gradient(30px 24px at 68% 60%, #25686e 97%, transparent 100%)
          #2e7f86;
      }
      .tower-pad--south-central i {
        left: 50%;
        top: 12px;
        width: 16px;
        height: 16px;
        translate: -50% 0;
        border: 2px solid #191d22;
        border-radius: 50%;
        background: #dcede9;
      }
    </style>
    <style id="interface-production-art">
      .battle-shell {
        font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      }

      .match-rail {
        border: 2px solid #191d22;
        background: linear-gradient(#3a4a56, #22303a);
        box-shadow: inset 0 0 0 2px #f4ebd64d, 0 5px 0 #191d2288;
      }

      .crown-track i {
        border: 2px solid #191d22;
        background: #101820;
        box-shadow: inset 0 2px 3px #0009;
      }

      .battle-shell:has([data-ui="hud-projection"]) .crown-track i {
        display: none;
      }

      .timer,
      [data-ui="hud-timer"] {
        top: 30px;
        border: 3px solid #191d22;
        border-radius: 14px;
        background: #f4ebd6;
        color: #191d22;
        text-shadow: none;
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 700;
        font-size: 32px;
        padding: 6px 16px;
        box-shadow: inset 0 -5px #e3cd9e, 0 5px 0 #191d2266;
      }

      [data-ui="hud-timer"] {
        z-index: 19;
      }

      .battle-shell:has([data-ui="hud-projection"]) > .timer {
        display: none;
      }

      [data-ui="hud-projection"][data-phase="overtime"] [data-ui="hud-timer"] {
        background: #e9a83a;
      }

      [data-ui="hud-projection"][data-phase="ended"] [data-ui="hud-timer"] {
        background: #8b8578;
        color: #f4ebd6;
      }

      [data-ui="hud-crowns"] {
        top: 34px;
        left: 492px;
        min-width: 0;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 5px 12px;
        border: 2px solid #191d22;
        border-radius: 12px;
        background: #101a22;
        box-shadow: inset 0 0 0 2px #f4ebd64d, 0 4px 0 #05090c99;
        color: #f4ebd6;
        font-size: 21px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 2px #000;
        z-index: 19;
      }

      [data-ui="hud-crowns"]::before {
        content: attr(data-north);
        padding-left: 21px;
        line-height: 21px;
        background-image:
          linear-gradient(#e9a83a, #e9a83a),
          linear-gradient(#e9a83a, #e9a83a),
          linear-gradient(#e9a83a, #e9a83a),
          linear-gradient(#e9a83a, #e9a83a);
        background-position: 0 100%, 1px 30%, 6px 0, 11px 30%;
        background-size: 16px 4px, 4px 8px, 4px 11px, 4px 8px;
        background-repeat: no-repeat;
      }

      [data-ui="hud-crowns"]::after {
        content: attr(data-south);
        padding-left: 21px;
        line-height: 21px;
        background-image:
          linear-gradient(#e9a83a, #e9a83a),
          linear-gradient(#e9a83a, #e9a83a),
          linear-gradient(#e9a83a, #e9a83a),
          linear-gradient(#e9a83a, #e9a83a);
        background-position: 0 100%, 1px 30%, 6px 0, 11px 30%;
        background-size: 16px 4px, 4px 8px, 4px 11px, 4px 8px;
        background-repeat: no-repeat;
      }

      [data-ui="hud-crowns"][data-north="0"]::before,
      [data-ui="hud-crowns"][data-south="0"]::after {
        background-image:
          linear-gradient(#8b8578, #8b8578),
          linear-gradient(#8b8578, #8b8578),
          linear-gradient(#8b8578, #8b8578),
          linear-gradient(#8b8578, #8b8578);
      }

      .elixir-rail {
        border-color: #191d22;
        background: #241a30;
        box-shadow: inset 0 3px 6px #000a, 0 3px 0 #191d2288;
      }

      .elixir-fill {
        box-shadow: inset 0 3px #f2a9ed66, inset 0 -3px #5b2b69;
      }

      .elixir-rail output {
        display: none;
      }

      [data-ui="hud-elixir"] {
        left: 556px;
        top: 1224px;
        min-width: 52px;
        padding: 5px 8px 8px;
        border: 3px solid #191d22;
        border-radius: 12px;
        background: radial-gradient(circle at 35% 25%, #f2a9ed, #b455c4 55%, #743684);
        box-shadow: 0 0 0 2px #f4ebd6, 0 4px 0 #191d2266;
        color: #fff;
        font-size: 24px;
        text-shadow: 0 2px #301036;
        z-index: 19;
      }

      .battle-shell:has([data-ui="hud-elixir"][data-amount="0"]) .elixir-fill { width: 0%; }
      .battle-shell:has([data-ui="hud-elixir"][data-amount="1"]) .elixir-fill { width: 10%; }
      .battle-shell:has([data-ui="hud-elixir"][data-amount="2"]) .elixir-fill { width: 20%; }
      .battle-shell:has([data-ui="hud-elixir"][data-amount="3"]) .elixir-fill { width: 30%; }
      .battle-shell:has([data-ui="hud-elixir"][data-amount="4"]) .elixir-fill { width: 40%; }
      .battle-shell:has([data-ui="hud-elixir"][data-amount="5"]) .elixir-fill { width: 50%; }
      .battle-shell:has([data-ui="hud-elixir"][data-amount="6"]) .elixir-fill { width: 60%; }
      .battle-shell:has([data-ui="hud-elixir"][data-amount="7"]) .elixir-fill { width: 70%; }
      .battle-shell:has([data-ui="hud-elixir"][data-amount="8"]) .elixir-fill { width: 80%; }
      .battle-shell:has([data-ui="hud-elixir"][data-amount="9"]) .elixir-fill { width: 90%; }
      .battle-shell:has([data-ui="hud-elixir"][data-amount="10"]) .elixir-fill { width: 100%; }

      .hand-tray {
        border: 3px solid #191d22;
        background: linear-gradient(#33424e, #1e2a33);
        box-shadow: inset 0 0 0 2px #f4ebd64d, 0 6px 0 #191d2288;
      }

      .next-card,
      .card-slot {
        border: 3px solid #191d22;
        background: #18232c;
        box-shadow: inset 0 4px 8px #0009, inset 0 0 0 2px #0c141b;
      }

      .audio-toggle {
        border: 2px solid #191d22;
        background: #f4ebd6;
        color: #191d22;
        box-shadow: inset 0 -4px #e3cd9e, 0 4px 0 #191d2266;
      }

      .audio-toggle:focus-visible {
        outline-color: #e9a83a;
      }

      .restart-control {
        left: 250px;
        top: 700px;
        width: 220px;
        min-height: 70px;
        border: 3px solid #191d22;
        border-radius: 16px;
        background: linear-gradient(#f4ebd6, #e3cd9e);
        color: #191d22;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 24px;
        font-weight: 700;
        text-shadow: none;
        box-shadow: inset 0 -6px #d9c49a, 0 7px 0 #191d2266;
      }

      .restart-control:focus-visible {
        outline-color: #191d22;
      }

      .game-browser-layer--feedback .match-feedback__overlay {
        border: 3px solid #191d22;
        border-radius: 22px;
        background: #f4ebd6f5;
        color: #191d22;
        text-shadow: none;
        box-shadow: inset 0 0 0 3px #e3cd9e, 0 26px 60px #000a;
      }

      .game-browser-layer--feedback .match-feedback__overlay strong {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 44px;
        letter-spacing: 1px;
      }

      .game-browser-layer--feedback .match-feedback__result {
        color: #4a332a;
        font-size: 22px;
      }

      .game-browser-layer--feedback .match-feedback__overlay[data-winner="north"] strong {
        color: #8a3226;
      }

      .game-browser-layer--feedback .match-feedback__overlay[data-winner="south"] strong {
        color: #1d5460;
      }

      .game-browser-layer--feedback .match-feedback__overlay[data-kind="draw"] strong {
        color: #4a332a;
      }

      .game-browser-layer--combat .combat-health {
        height: 7px;
        box-shadow: 0 0 0 2px #191d22;
      }

      .game-browser-layer--combat .combat-marker--tower .combat-health {
        width: 46px;
        height: 8px;
      }

      .hud-card {
        border: 3px solid #191d22;
        border-radius: 10px;
        box-shadow: inset 0 0 0 2px #f4ebd6, 3px 4px 0 #191d2259;
        color: #f4ebd6;
      }

      .hud-card__name {
        position: absolute;
        z-index: 1;
        left: 3px;
        right: 3px;
        bottom: 3px;
        padding: 2px 2px 3px;
        border-radius: 6px;
        background: #191d22cc;
        box-shadow: inset 0 0 0 1px #f4ebd63d;
        font-size: 10px;
        line-height: 1.05;
        letter-spacing: .2px;
      }

      .hud-card__cost {
        top: -7px;
        left: -7px;
        width: 26px;
        height: 26px;
        border: 2px solid #191d22;
        background: radial-gradient(circle at 35% 28%, #f2a9ed, #b455c4 58%, #743684);
        box-shadow: 0 0 0 2px #f4ebd6, 2px 3px 0 #191d2288;
        color: #fff;
        font-size: 15px;
        line-height: 1;
      }

      .hud-card::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 7px;
        translate: -50%;
        width: 48px;
        height: 40px;
        filter: drop-shadow(2px 3px 0 #191d2155);
      }

      .hud-card[data-kind="next"] {
        filter: saturate(.85) brightness(.92);
      }

      .hud-card[data-kind="next"]::before {
        width: 34px;
        height: 28px;
        top: 5px;
      }

      .hud-card[data-selected="true"] {
        border-color: #e9a83a;
        box-shadow:
          inset 0 0 0 3px #e9a83a,
          0 0 0 2px #191d22,
          0 0 18px #e9a83acc,
          3px 4px 0 #191d2259;
      }

      .hud-card[data-disabled="true"] {
        filter: grayscale(.75) brightness(.62);
      }

      .hud-card[data-insufficient="true"] {
        border-style: dashed;
        border-color: #5c5346;
      }

      .hud-card[data-insufficient="true"] .hud-card__cost {
        filter: grayscale(.9) brightness(.8);
      }

      .hud-card[data-card-id="coilblade"] {
        background: linear-gradient(180deg, #4a332a, #33221b);
      }

      .hud-card[data-card-id="coilblade"]::before {
        background: linear-gradient(90deg, #8b8578 0 42%, #a49d8d 42% 58%, #8b8578 58%);
        clip-path: polygon(
          40% 0, 60% 0, 60% 62%, 96% 62%, 96% 74%, 58% 74%, 58% 84%,
          80% 100%, 20% 100%, 42% 84%, 42% 74%, 4% 74%, 4% 62%, 40% 62%);
      }

      .hud-card[data-card-id="mossguard"] {
        background: linear-gradient(180deg, #2c4222, #1c2b16);
      }

      .hud-card[data-card-id="mossguard"]::before {
        background:
          radial-gradient(circle at 50% 40%, #dcede9 0 8px, transparent 9px),
          linear-gradient(180deg, #5c8a46 0 55%, #47703a 55%);
        clip-path: polygon(0 42%, 50% 0, 100% 42%, 100% 100%, 0 100%);
      }

      .hud-card[data-card-id="copperskiff"] {
        background: linear-gradient(180deg, #16324f, #0e2136);
      }

      .hud-card[data-card-id="copperskiff"]::before {
        background:
          linear-gradient(180deg, #e9a83a 0 18%, #4a332a 18% 30%, transparent 30%),
          linear-gradient(90deg, #4a332a 0 26%, #6b4a3a 26% 74%, #4a332a 74%);
        clip-path: polygon(2% 30%, 98% 30%, 76% 96%, 24% 96%);
      }

      .hud-card[data-card-id="copperskiff"]::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 54px;
        translate: -50%;
        width: 56px;
        height: 6px;
        border-radius: 3px;
        background: linear-gradient(90deg, #16324f, #2e7f86 45% 55%, #16324f);
      }

      .hud-card[data-kind="next"][data-card-id="copperskiff"]::after {
        top: 37px;
        width: 40px;
      }

      .hud-card[data-card-id="skymaul"] {
        background: linear-gradient(180deg, #4a332a, #33221b);
      }

      .hud-card[data-card-id="skymaul"]::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 8px;
        translate: -50%;
        width: 54px;
        height: 14px;
        border-radius: 50% 50% 8px 8px / 100% 100% 8px 8px;
        background: linear-gradient(180deg, #e9a83a, #c6452e);
        box-shadow: 0 2px 0 #191d22;
      }

      .hud-card[data-card-id="skymaul"]::before {
        top: 24px;
        background: linear-gradient(90deg, #c6452e 0 50%, #a03a28 50%);
        clip-path: polygon(50% 100%, 6% 30%, 30% 0, 70% 0, 94% 30%);
      }

      .hud-card[data-kind="next"][data-card-id="skymaul"]::before {
        top: 16px;
      }

      .hud-card[data-kind="next"][data-card-id="skymaul"]::after {
        top: 4px;
        width: 38px;
        height: 10px;
      }

      .hud-card[data-card-id="brassbolt"] {
        background: linear-gradient(180deg, #4a332a, #33221b);
      }

      .hud-card[data-card-id="brassbolt"]::before {
        background: linear-gradient(90deg, #e9a83a 0 46%, #c9872c 46%);
